<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>国庆节快乐</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at 50% 40%, #3a0000, #8b0000 40%, #1a0000 100%);
    font-family: "Microsoft YaHei", sans-serif;
    position: relative;
    touch-action: none;
    cursor: crosshair;
  }
  /* 星空 */
  #stars {
    position: absolute;
    inset: 0;
    z-index: 0;
  }
  /* 3D 文字容器 */
  .scene {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1200px;
    z-index: 3;
    pointer-events: none;
  }
  .title {
    font-size: clamp(42px, 13vw, 150px);
    font-weight: 900;
    color: #fff;
    text-align: center;
    line-height: 1.15;
    letter-spacing: .06em;
    text-shadow:
      0 0 10px #ffcc00,
      0 0 25px #ffaa00,
      0 0 50px #ff6600,
      0 0 80px #ff3300;
    transform-style: preserve-3d;
    animation: rotate3d 8s ease-in-out infinite, float 3s ease-in-out infinite;
  }
  @keyframes rotate3d {
    0%   { transform: rotateY(-18deg) rotateX(8deg); }
    50%  { transform: rotateY(18deg) rotateX(-8deg); }
    100% { transform: rotateY(-18deg) rotateX(8deg); }
  }
  @keyframes float {
    0%,100% { translate: 0 0; }
    50%     { translate: 0 -16px; }
  }
  /* 红旗 */
  #flag {
    position: absolute;
    top: 6%;
    left: 50%;
    transform: translateX(-50%);
    width: clamp(120px, 26vw, 240px);
    z-index: 2;
    filter: drop-shadow(0 0 16px rgba(255,80,0,.6));
    pointer-events: none;
    opacity: .92;
  }
  /* 提示 */
  .hint {
    position: absolute;
    bottom: 3.5vh;
    width: 100%;
    text-align: center;
    color: rgba(255,255,255,.8);
    font-size: clamp(13px, 3.4vw, 18px);
    letter-spacing: .12em;
    z-index: 6;
    animation: blink 2.4s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes blink { 0%,100%{opacity:.35} 50%{opacity:1} }
  /* 飘落元素 */
  .fall {
    position: absolute;
    top: -6%;
    font-size: 22px;
    animation: fall linear forwards;
    z-index: 2;
    pointer-events: none;
  }
  @keyframes fall {
    to { transform: translateY(112vh) rotate(360deg); opacity: 0; }
  }
  /* 烟花粒子 */
  .spark {
    position: fixed;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 8;
    will-change: transform, opacity;
  }
  /* 打字机 */
  .type {
    position: absolute;
    bottom: 11vh;
    width: 100%;
    text-align: center;
    color: #ffd700;
    font-size: clamp(15px, 4vw, 24px);
    letter-spacing: .18em;
    z-index: 5;
    text-shadow: 0 0 12px rgba(255,200,0,.8);
    pointer-events: none;
  }
  .type::after {
    content: '|';
    animation: caret .8s steps(1) infinite;
  }
  @keyframes caret { 50% { opacity: 0; } }
  /* 音乐按钮 */
  .music-btn {
    position: absolute;
    top: 16px;
    right: 16px;
    z-index: 10;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(255,215,0,.6);
    background: rgba(0,0,0,.35);
    color: #ffd700;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(6px);
    transition: transform .2s, background .2s;
  }
  .music-btn:hover { transform: scale(1.1); background: rgba(255,215,0,.2); }
  .music-btn.playing { animation: spin 4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

  <!-- 星空 canvas -->
  <canvas id="stars"></canvas>

  <!-- 红旗（用 CSS 动画模拟飘动） -->
  <svg id="flag" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"  stop-color="#c8102e"/>
        <stop offset="50%" stop-color="#ff1e1e"/>
        <stop offset="100%" stop-color="#a50d22"/>
      </linearGradient>
      <filter id="wavy">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.04" numOctaves="2" seed="3">
          <animate attributeName="baseFrequency" dur="6s" values="0.012 0.04;0.02 0.06;0.012 0.04" repeatCount="indefinite"/>
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" scale="12"/>
      </filter>
    </defs>
    <g filter="url(#wavy)">
      <rect x="0" y="0" width="300" height="200" fill="url(#redGrad)" rx="6"/>
      <g fill="#ffde00">
        <polygon points="50,30 58,52 82,52 63,66 70,88 50,74 30,88 37,66 18,52 42,52"/>
        <polygon points="100,20 105,33 119,33 108,42 112,55 100,47 88,55 92,42 81,33 95,33" transform="scale(0.85) translate(15,5)"/>
        <polygon points="100,20 105,33 119,33 108,42 112,55 100,47 88,55 92,42 81,33 95,33" transform="scale(0.85) translate(40,5)"/>
        <polygon points="100,20 105,33 119,33 108,42 112,55 100,47 88,55 92,42 81,33 95,33" transform="scale(0.85) translate(25,30)"/>
        <polygon points="100,20 105,33 119,33 108,42 112,55 100,47 88,55 92,42 81,33 95,33" transform="scale(0.85) translate(50,30)"/>
      </g>
    </g>
  </svg>

  <!-- 3D 标题 -->
  <div class="scene">
    <div class="title">国庆节<br>快乐</div>
  </div>

  <!-- 打字机 -->
  <div class="type" id="typeText"></div>

  <!-- 提示 -->
  <div class="hint">点击屏幕放烟花 · 右上角开启音乐</div>

  <!-- 音乐按钮 -->
  <div class="music-btn" id="musicBtn">♪</div>

  <!-- 音乐文件：请确保同文件夹下有 园游会-周杰伦.mp3，或改成你自己的文件名 -->
  <audio id="bgm" loop>
    <source src="游园会 - 周杰伦.mp3" type="audio/mpeg">
  </audio>

<script>
  /* ============ 1. 星空 + 流星 ============ */
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  let W, H, stars = [];

  function initStars() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    stars = [];
    const count = Math.floor((W * H) / 6000);
    for (let i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.6 + 0.3,
        a: Math.random(),
        da: 0.005 + Math.random() * 0.02
      });
    }
  }
  initStars();
  window.addEventListener('resize', initStars);

  // 流星
  let meteors = [];
  setInterval(() => {
    if (Math.random() < 0.6) {
      meteors.push({
        x: Math.random() * W,
        y: -50,
        len: 120 + Math.random() * 120,
        speed: 6 + Math.random() * 6,
        angle: Math.PI / 4 + (Math.random() - 0.5) * 0.3,
        life: 1
      });
    }
  }, 1200);

  function drawStars() {
    ctx.clearRect(0, 0, W, H);
    // 星星
    for (const s of stars) {
      s.a += s.da;
      if (s.a > 1 || s.a < 0.2) s.da *= -1;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 240, 200, ${s.a})`;
      ctx.shadowBlur = 8;
      ctx.shadowColor = 'rgba(255,220,150,.8)';
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    // 流星
    meteors = meteors.filter(m => m.life > 0);
    for (const m of meteors) {
      m.x += Math.cos(m.angle) * m.speed;
      m.y += Math.sin(m.angle) * m.speed;
      m.life -= 0.008;
      const grad = ctx.createLinearGradient(
        m.x, m.y,
        m.x - Math.cos(m.angle) * m.len,
        m.y - Math.sin(m.angle) * m.len
      );
      grad.addColorStop(0, `rgba(255,255,220,${m.life})`);
      grad.addColorStop(1, 'rgba(255,255,220,0)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(m.x, m.y);
      ctx.lineTo(m.x - Math.cos(m.angle) * m.len, m.y - Math.sin(m.angle) * m.len);
      ctx.stroke();
    }
    requestAnimationFrame(drawStars);
  }
  drawStars();

  /* ============ 2. 飘落元素 ============ */
  const chars = ['★', '✦', '✧', '🇨🇳'];
  setInterval(() => {
    const s = document.createElement('div');
    s.className = 'fall';
    s.textContent = chars[Math.floor(Math.random() * chars.length)];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.animationDuration = (3 + Math.random() * 3) + 's';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 6500);
  }, 220);

  /* ============ 3. 烟花（带拖尾/重力和闪烁） ============ */
  const colors = ['#ff2d2d', '#ffd700', '#fff', '#ff8c00', '#ff4fa3', '#4fc3ff', '#ff69b4'];

  function firework(x, y, count = 60) {
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'spark';
      const color = colors[Math.floor(Math.random() * colors.length)];
      p.style.background = color;
      p.style.boxShadow = `0 0 12px ${color}, 0 0 24px ${color}`;
      p.style.left = x + 'px';
      p.style.top  = y + 'px';
      document.body.appendChild(p);

      const angle = Math.random() * Math.PI * 2;
      const dist = 80 + Math.random() * 180;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist - 40; // 稍微向上

      p.animate([
        { transform: 'translate(0,0) scale(1)', opacity: 1, offset: 0 },
        { transform: `translate(${dx * 0.7}px, ${dy * 0.7}px) scale(1.2)`, opacity: 1, offset: 0.5 },
        { transform: `translate(${dx}px, ${dy + 80}px) scale(0)`, opacity: 0, offset: 1 }
      ], {
        duration: 900 + Math.random() * 700,
        easing: 'cubic-bezier(.15,.65,.4,1)'
      });

      setTimeout(() => p.remove(), 1800);
    }
    // 中心闪光
    const flash = document.createElement('div');
    flash.className = 'spark';
    flash.style.cssText = `left:${x}px;top:${y}px;width:60px;height:60px;margin:-30px 0 0 -30px;background:radial-gradient(circle,#fff,#ffd700 40%,transparent 70%);`;
    document.body.appendChild(flash);
    flash.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 400 });
    setTimeout(() => flash.remove(), 400);
  }

  /* 点击 / 触摸触发 */
  document.addEventListener('click', (e) => firework(e.clientX, e.clientY));
  document.addEventListener('touchstart', (e) => {
    for (const t of e.touches) firework(t.clientX, t.clientY);
  }, { passive: true });

  /* ============ 4. 自动循环烟花秀 ============ */
  function autoShow() {
    const x = Math.random() * window.innerWidth;
    const y = Math.random() * window.innerHeight * 0.7;
    firework(x, y, 70);
  }
  setInterval(autoShow, 2500);
  // 开头先炸一波
  setTimeout(autoShow, 600);
  setTimeout(autoShow, 1200);

  /* ============ 5. 打字机 ============ */
  const text = "金秋十月，红旗漫卷，山河锦绣，岁月峥嵘。愿我们伟大的祖国繁荣昌盛、国泰民安、风调雨顺、五谷丰登。愿山河无恙，人间皆安，愿每一寸土地都盛开花朵，每一个梦想都扬帆远航，盛世中华，生日快乐！";
  const el = document.getElementById('typeText');
  let idx = 0;
  function typeLoop() {
    el.textContent = text.slice(0, idx);
    idx++;
    if (idx > text.length) {
      setTimeout(() => { idx = 0; typeLoop(); }, 2500);
    } else {
      setTimeout(typeLoop, 180);
    }
  }
  typeLoop();

  /* ============ 6. 音乐 ============ */
  const btn = document.getElementById('musicBtn');
  const bgm = document.getElementById('bgm');
  let playing = false;
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (playing) {
      bgm.pause();
      btn.classList.remove('playing');
      btn.textContent = '♪';
    } else {
      bgm.play().then(() => {
        btn.classList.add('playing');
        btn.textContent = '♫';
      }).catch(() => {
        alert('音乐文件没找到，请确认同文件夹下有 园游会-周杰伦.mp3');
      });
    }
    playing = !playing;
  });
</script>
</body>
</html>
