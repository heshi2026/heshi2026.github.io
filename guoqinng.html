<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>国庆节快乐</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: linear-gradient(160deg, #8b0000, #d62828 60%, #ffcc00);
    font-family: "Microsoft YaHei", sans-serif;
    position: relative;
    touch-action: none;
  }
  .wrap {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 5vw;
    z-index: 2;
    pointer-events: none;
  }
  .title {
    font-size: clamp(48px, 16vw, 180px);
    font-weight: 900;
    color: #fff;
    text-align: center;
    line-height: 1.2;
    text-shadow: 0 0 20px #ffcc00, 0 0 40px #ff6600;
    letter-spacing: .08em;
    animation: float 2.5s ease-in-out infinite;
  }
  @keyframes float {
    0%,100% { transform: translateY(0) scale(1); }
    50%     { transform: translateY(-14px) scale(1.04); }
  }
  .star {
    position: absolute;
    color: #ffd700;
    animation: twinkle 1.8s infinite alternate;
    z-index: 1;
  }
  @keyframes twinkle {
    from { opacity: .3; transform: scale(.8); }
    to   { opacity: 1;  transform: scale(1.2); }
  }
  .fall {
    position: absolute;
    top: -6%;
    font-size: 22px;
    animation: fall linear forwards;
    z-index: 1;
    pointer-events: none;
  }
  @keyframes fall {
    to { transform: translateY(112vh) rotate(360deg); opacity: 0; }
  }
  .spark {
    position: fixed;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 5;
  }
  .hint {
    position: absolute;
    bottom: 4vh;
    width: 100%;
    text-align: center;
    color: rgba(255,255,255,.85);
    font-size: clamp(14px, 3.5vw, 20px);
    letter-spacing: .1em;
    z-index: 3;
    animation: blink 2s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes blink { 0%,100%{opacity:.4} 50%{opacity:1} }
</style>
</head>
<body>

  <div class="wrap">
    <div class="title">国庆节<br>快乐</div>
  </div>

  <div class="star" style="top:8%;left:8%;font-size:clamp(40px,12vw,80px);">★</div>
  <div class="star" style="top:14%;right:10%;font-size:clamp(30px,9vw,60px);animation-delay:.4s;">★</div>
  <div class="star" style="bottom:14%;left:14%;font-size:clamp(35px,10vw,70px);animation-delay:.8s;">★</div>
  <div class="star" style="bottom:10%;right:12%;font-size:clamp(45px,13vw,90px);animation-delay:.2s;">★</div>

  <div class="hint">轻触屏幕 放烟花</div>

<script>
  const chars = ['★', '✦', '✧', '🇨🇳'];
  setInterval(() => {
    const s = document.createElement('div');
    s.className = 'fall';
    s.textContent = chars[Math.floor(Math.random() * chars.length)];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.animationDuration = (3 + Math.random() * 3) + 's';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 6500);
  }, 220);

  const colors = ['#ff2d2d', '#ffd700', '#fff', '#ff8c00', '#ff4fa3', '#4fc3ff'];

  function firework(x, y) {
    const count = 22;
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'spark';
      const color = colors[Math.floor(Math.random() * colors.length)];
      p.style.background = color;
      p.style.boxShadow = `0 0 10px ${color}, 0 0 20px ${color}`;
      p.style.left = x + 'px';
      p.style.top  = y + 'px';
      document.body.appendChild(p);

      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
      const dist  = 60 + Math.random() * 90;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist;

      p.animate([
        { transform: 'translate(0,0) scale(1)', opacity: 1 },
        { transform: `translate(${dx}px, ${dy}px) scale(0)`, opacity: 0 }
      ], {
        duration: 700 + Math.random() * 400,
        easing: 'cubic-bezier(.2,.6,.4,1)'
      });

      setTimeout(() => p.remove(), 1200);
    }
  }

  document.addEventListener('click', (e) => firework(e.clientX, e.clientY));
  document.addEventListener('touchstart', (e) => {
    for (const t of e.touches) firework(t.clientX, t.clientY);
  }, { passive: true });
</script>
</body>
</html>
