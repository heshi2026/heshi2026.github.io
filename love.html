<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>表白代码</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: "Microsoft YaHei", sans-serif;
    background: #f5d7dc;
    user-select: none;
  }
  #app {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: background .4s;
    overflow: hidden;
  }
  #app.yes { background: #dc3c50; }

  /* ================= 奶龙 + 头像 ================= */
  .nailong {
    width: 170px;
    height: 170px;
    position: relative;
    margin-bottom: 28px;
    transition: opacity .3s;
    animation: bob 2.2s ease-in-out infinite;
  }
  #app.yes .nailong { opacity: 0; position: absolute; }

  /* 黄色奶龙身体 */
  .nailong .body {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 35% 30%, #fff2a8, #ffd93b 60%, #f2b705);
    border-radius: 50%;
    box-shadow: inset -8px -10px 0 rgba(200, 140, 0, .25),
                0 8px 24px rgba(0,0,0,.15);
    z-index: 1;
  }

  /* 头像圆 */
  .nailong .face-img {
    position: absolute;
    width: 112px;
    height: 112px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    object-fit: cover;
    z-index: 2;
    border: 4px solid #fff;
    box-shadow: 0 4px 12px rgba(0,0,0,.15);
  }

  /* 两只粉角 */
  .nailong .horn {
    position: absolute;
    width: 46px; height: 46px;
    background: linear-gradient(180deg, #ffc0d4, #ff5c8a);
    border-radius: 50% 50% 40% 40%;
    top: -18px;
    box-shadow: inset -3px -4px 0 rgba(180, 40, 80, .2);
    z-index: 3;
  }
  .nailong .horn.left  { left: 16px;  transform: rotate(-15deg); }
  .nailong .horn.right { right: 16px; transform: rotate(15deg); }

  @keyframes bob {
    0%,100% { transform: translateY(0) rotate(-2deg); }
    50%     { transform: translateY(-8px) rotate(2deg); }
  }

  /* ================= 文字 ================= */
  .text-wrap {
    text-align: center;
    margin-bottom: 40px;
    transition: opacity .3s;
    z-index: 5;
  }
  #app.yes .text-wrap { opacity: 0; position: absolute; }
  .line1 { font-size: 22px; color: #222; margin-bottom: 6px; }
  .line2 { font-size: 40px; font-weight: 900; color: #c83250; }

  /* ================= 按钮 ================= */
  .btns {
    display: flex;
    gap: 24px;
    justify-content: center;
    align-items: center;
    z-index: 4;
    position: relative;
    transition: opacity .3s;
  }
  #app.yes .btns { opacity: 0; pointer-events: none; }

  .btn {
    border: none;
    border-radius: 14px;
    color: #fff;
    font-size: 20px;
    font-family: inherit;
    cursor: pointer;
    padding: 16px 32px;
  }
  .btn-yes { background: #e68ca0; font-weight: 700; }
  .btn-no  { background: #c8bec8; white-space: nowrap; }

  /* ================= 同意画面 ================= */
  .yes-content {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    z-index: 5;
  }
  #app.yes .yes-content { display: flex; }
  .yes-content .big  { font-size: 44px; font-weight: 900; margin-bottom: 12px; }
  .yes-content .love { font-size: 36px; color: #ffd250; margin-bottom: 24px; }
  .yes-content .sign { font-size: 18px; opacity: .85; }

  /* 飘心 */
  .heart {
    position: fixed;
    pointer-events: none;
    z-index: 20;
    animation: rise linear forwards;
  }
  @keyframes rise {
    from { transform: translateY(0) scale(1); opacity: 1; }
    to   { transform: translateY(-80vh) scale(.4); opacity: 0; }
  }
</style>
</head>
<body>

<div id="app">

  <!-- ============ 奶龙 + 头像 ============ -->
  <div class="nailong">
    <div class="body"></div>
    < img src="jj.jpg" alt="JJ" class="face-img">
    <div class="horn left"></div>
    <div class="horn right"></div>
  </div>

  <div class="text-wrap">
    <div class="line1">JJ 向你发送了一封</div>
    <div class="line2">对象邀请函</div>
  </div>

  <div class="btns" id="btns">
    <button class="btn btn-yes" id="btnYes">同意</button>
    <button class="btn btn-no"  id="btnNo">？你认真的吗</button>
  </div>

  <div class="yes-content">
    <div class="big">我就知道你会同意！</div>
    <div class="love">❤ 喜欢你 ❤</div>
    <div class="sign">—— JJ</div>
  </div>

</div>

<script>
  const app    = document.getElementById('app');
  const btnNo  = document.getElementById('btnNo');
  const btnYes = document.getElementById('btnYes');

  let grow = 0;
  const MAX_GROW = 7;
  let baseW = 0, baseH = 0;
  let floating = false;

  // 点“同意”直接跳转
  btnYes.addEventListener('click', () => {
    goYes();
  });

  // 点“不同意”：变大 + 随机跑
  btnNo.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    if (grow >= MAX_GROW) return;

    if (!floating) {
      const rect = btnNo.getBoundingClientRect();
      baseW = rect.width;
      baseH = rect.height;
      floating = true;

      btnNo.style.position = 'fixed';
      btnNo.style.margin = '0';
      btnNo.style.left = rect.left + 'px';
      btnNo.style.top  = rect.top + 'px';
      btnNo.style.transformOrigin = 'top left';
      btnNo.style.zIndex = '10';
    }

    grow += 1;
    const scale = Math.pow(1.45, grow);

    const finalW = baseW * scale;
    const finalH = baseH * scale;
    const w = window.innerWidth;
    const h = window.innerHeight;

    // 已经大到覆盖屏幕 → 强制同意
    if (finalW >= w * 0.9 && finalH >= h * 0.85) {
      btnNo.style.left = '50%';
      btnNo.style.top  = '50%';
      btnNo.style.transform = `translate(-50%, -50%) scale(${scale})`;
      btnNo.style.transformOrigin = 'center center';
      setTimeout(goYes, 300);
      return;
    }

    // 随机跳一个能完整放下的位置
    const maxLeft = Math.max(0, w - finalW);
    const maxTop  = Math.max(0, h - finalH);
    const newLeft = Math.random() * maxLeft;
    const newTop  = Math.random() * maxTop;

    btnNo.style.left = newLeft + 'px';
    btnNo.style.top  = newTop + 'px';
    btnNo.style.transform = `scale(${scale})`;
    btnNo.style.transformOrigin = 'top left';
  });

  btnNo.addEventListener('touchstart', (e) => {
    e.preventDefault();
    e.stopPropagation();
    btnNo.click();
  }, { passive: false });

  function goYes() {
    if (app.classList.contains('yes')) return;
    app.classList.add('yes');
    spawnHearts(60);
    setInterval(() => spawnHearts(3), 220);
  }

  function spawnHearts(n) {
    const colors = ['#ff5078', '#ff82a0', '#ffb4c8', '#ffd250'];
    for (let i = 0; i < n; i++) {
      const el = document.createElement('div');
      el.className = 'heart';
      el.textContent = '❤';
      el.style.left = (Math.random() * 100) + 'vw';
      el.style.bottom = '0';
      el.style.fontSize = (14 + Math.random() * 30) + 'px';
      el.style.color = colors[Math.floor(Math.random() * colors.length)];
      el.style.animationDuration = (2.5 + Math.random() * 2.5) + 's';
      el.style.animationDelay = (Math.random() * 0.6) + 's';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 6000);
    }
  }
</script>
</body>
</html>
